name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Salin aset web ke folder www
        run: |
          mkdir -p www
          rsync -av --exclude='www' --exclude='node_modules' --exclude='android' --exclude='.git' --exclude='.github' --exclude='package*.json' --exclude='capacitor.config.json' ./ www/

      - name: Install Capacitor dan generate proyek Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload file APK
        uses: actions/upload-artifact@v4
        with:
          name: Mas-Finance-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
